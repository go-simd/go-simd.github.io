baseURL = "https://go-simd.github.io/"
title = "go-simd"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# Each repo card. "result" is the honest headline (wins AND parities/non-SIMD
# outcomes). "kind" tags whether it is a stdlib drop-in or a primitive.
[[params.repos]]
  name = "base64"
  accel = "encoding/base64"
  kind = "drop-in"
  result = "encode ~17× stdlib; beats emmansun/base64 ~5–6% (cycle-model-guided)."
[[params.repos]]
  name = "base32"
  accel = "encoding/base32"
  kind = "drop-in"
  result = "encode ~7.9× stdlib (AVX2). Real SIMD on ppc64le VSRH + s390x VMLHH where arm64 can't. No prior pure-Go SIMD base32."
[[params.repos]]
  name = "hex"
  accel = "encoding/hex"
  kind = "drop-in"
  result = "beats tmthrgd/go-hex both ways — encode 20.4×, decode 6.24× stdlib."
[[params.repos]]
  name = "utf8"
  accel = "unicode/utf8"
  kind = "drop-in"
  result = "Valid ~19× stdlib, edges stuartcarnie/go-simd ~3.5% (Lemire/Keiser)."
[[params.repos]]
  name = "adler32"
  accel = "hash/adler32"
  kind = "drop-in"
  result = "~12–14× stdlib, but ~7% behind mhr3/adler32-simd — near-parity, honest."
[[params.repos]]
  name = "strconv"
  accel = "strconv (base-10 parse)"
  kind = "drop-in"
  result = "modest, honest 1.13–1.37× on long inputs; never regresses (delegates short)."
[[params.repos]]
  name = "matchlen"
  accel = "LZ match-finder primitive"
  kind = "primitive"
  result = "~10× scalar (NEON); real SIMD on all 6 arches; AVX2 ~2.08× SSE2."
[[params.repos]]
  name = "bitpack"
  accel = "FastPFOR / simdcomp bit-packing"
  kind = "primitive"
  result = "~21–32× scalar — byte-exact vs Lemire's simdcomp."
[[params.repos]]
  name = "popcount"
  accel = "Hamming weight over []byte"
  kind = "primitive"
  result = "size-dependent: ~9–12× in-cache, converges to memory-bound out-of-cache."
[[params.repos]]
  name = "histogram"
  accel = "byte-value histogram"
  kind = "primitive"
  result = "multi-table scalar — measured, SIMD does NOT help (no scatter on AVX2/NEON)."
[[params.repos]]
  name = "crc64"
  accel = "hash/crc64"
  kind = "drop-in"
  result = "first pure-Go SIMD crc64 (stdlib + all Go libs are scalar); CLMUL folding, arm64 ~4.2× stdlib; all 6 arches (riscv64/loong64 scalar)."
[[params.repos]]
  name = "ascii85"
  accel = "encoding/ascii85"
  kind = "drop-in"
  result = "first SIMD ascii85; real SIMD on 5 of 6 arches (arm64 = scalar — Go's arm64 asm lacks vector integer multiply), still ~1.9× stdlib."
[[params.repos]]
  name = "floats"
  accel = "Dot/Sum/Min/Max/Distance/CosineSimilarity (float32 + float64)"
  kind = "primitive"
  result = "only pure-Go lib with the full vector-search API on all 6 arches (gonum/vek/kelindar are amd64-centric or partial); arm64 ~2× scalar."
[[params.repos]]
  name = "xxhash"
  accel = "XXH3-64"
  kind = "primitive"
  result = "first Go XXH3 on all 6 SIMD arches, bit-exact vs official vectors. Honest: zeebo faster on arm64 (~22 vs ~15 GB/s) — value is breadth, not peak."
[[params.repos]]
  name = "streamvbyte"
  accel = "Stream VByte uint32 codec"
  kind = "primitive"
  result = "first Go port on all 6 arches (others amd64-only); full codec — SIMD encode and decode, byte-identical to lemire/streamvbyte; decode arm64 ~10× scalar."
[[params.repos]]
  name = "ascii"
  accel = "ASCII case (ToUpper/ToLower/EqualFold)"
  kind = "drop-in"
  result = "branchless vector case-fold, byte-identical to bytes/strings; real SIMD on all 6 arches incl. arm64 (multiply-free sign-bit predicate); arm64 ~4.9× stdlib (ToUpper)."
[[params.repos]]
  name = "levenshtein"
  accel = "edit distance (Distance)"
  kind = "primitive"
  result = "Myers bit-parallel edit distance, 62–142× vs agnivade/levenshtein on long inputs. Honest: pure-Go bit-parallel, not vector-SIMD (word-serial column, no lane parallelism); endian-clean on all 6 arches."
[[params.repos]]
  name = "bitset"
  accel = "bulk []uint64 set ops"
  kind = "primitive"
  result = "SIMD And/Or/AndNot/Xor + fused Count/IntersectionCount; amd64 Count ~3–3.9×. Honest: logical ops are bandwidth-bound (converge to scalar out-of-cache), popcount wins across the board."
[[params.repos]]
  name = "int8dot"
  accel = "int8 quantized dot (Dot/DotUint8/DotU8S8)"
  kind = "primitive"
  result = "INT8 multiply-accumulate for ML embeddings, bit-exact vs scalar; amd64 AVX2 ~4×; arm64 NEON kernel on Go 1.27 (VSMULL/VUMULL; scalar on stable Go ≤ 1.26)."
[[params.repos]]
  name = "jsonvalidate"
  accel = "encoding/json.Valid"
  kind = "drop-in"
  result = "byte-identical verdict to encoding/json.Valid; only SIMD JSON validator on all 6 arches (simdjson-go is amd64-only); SIMD string/space scans, ~1.4× on string-heavy JSON (number-/structure-heavy stays scalar)."
