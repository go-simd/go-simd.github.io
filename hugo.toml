baseURL = "https://go-simd.github.io/"
title = "go-simd"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# Each repo card. "result" is the honest headline (wins AND parities/non-SIMD
# outcomes). "kind" tags whether it is a stdlib drop-in or a primitive.
[[params.repos]]
  name = "base64"
  accel = "encoding/base64"
  kind = "drop-in"
  result = "encode ~17× stdlib; beats emmansun/base64 ~5–6% (cycle-model-guided)."
[[params.repos]]
  name = "base32"
  accel = "encoding/base32"
  kind = "drop-in"
  result = "encode ~7.9× stdlib (AVX2), now SIMD decode too + arm64 NEON encode on Go 1.27. Real SIMD on ppc64le VSRH + s390x VMLHH where arm64 can't; ppc64le now measured on real POWER9 (decode ~5.5×). No prior pure-Go SIMD base32."
[[params.repos]]
  name = "hex"
  accel = "encoding/hex"
  kind = "drop-in"
  result = "beats tmthrgd/go-hex both ways — encode 20.4×, decode 6.24× stdlib."
[[params.repos]]
  name = "utf8"
  accel = "unicode/utf8"
  kind = "drop-in"
  result = "Valid ~19× stdlib, edges stuartcarnie/go-simd ~3.5% (Lemire/Keiser)."
[[params.repos]]
  name = "adler32"
  accel = "hash/adler32"
  kind = "drop-in"
  result = "~12–14× stdlib, but ~7% behind mhr3/adler32-simd — near-parity, honest."
[[params.repos]]
  name = "strconv"
  accel = "strconv (base-10 parse + ParseFloat)"
  kind = "drop-in"
  result = "ParseInt/Atoi ~2.2–2.7× on long inputs; added SIMD ParseFloat (Eisel-Lemire, ~1.1–1.36×); never regresses (delegates short/uncertain)."
[[params.repos]]
  name = "matchlen"
  accel = "LZ match-finder primitive"
  kind = "primitive"
  result = "~10× scalar (NEON); real SIMD on all 6 arches; AVX2 ~2.08× SSE2. Measured native: ppc64le POWER9 ~6.3×, riscv64 X60 ~5.8×, loong64 ~11.4× scalar."
[[params.repos]]
  name = "bitpack"
  accel = "FastPFOR / simdcomp bit-packing"
  kind = "primitive"
  result = "~21–32× scalar — byte-exact vs Lemire's simdcomp. ppc64le measured on real POWER9: Pack ~7.0×, Unpack ~11.3× (overturns the earlier ~1.1× llvm-mca estimate)."
[[params.repos]]
  name = "popcount"
  accel = "Hamming weight over []byte"
  kind = "primitive"
  result = "size-dependent: ~9–12× in-cache, converges to memory-bound out-of-cache. Measured native: loong64 LSX ~6.1×, ppc64le POWER9 ~2.9× scalar (riscv64 stays scalar — no per-element vector popcount in Go's RVV asm)."
[[params.repos]]
  name = "histogram"
  accel = "byte-value histogram"
  kind = "primitive"
  result = "multi-table scalar — measured, SIMD does NOT help (no scatter on AVX2/NEON)."
[[params.repos]]
  name = "crc64"
  accel = "hash/crc64"
  kind = "drop-in"
  result = "first pure-Go SIMD crc64 (stdlib + all Go libs are scalar); CLMUL folding, arm64 ~4.2× stdlib; all 6 arches (riscv64/loong64 scalar)."
[[params.repos]]
  name = "ascii85"
  accel = "encoding/ascii85"
  kind = "drop-in"
  result = "first SIMD ascii85, SIMD encode AND decode; real SIMD on all 6 arches incl. an arm64 NEON kernel on Go 1.27. Measured native: ppc64le POWER9 ~2.9× encode, riscv64 X60 ~4.0×, loong64 ~4.3×; arm64 NEON ~3.0× / fused-scalar ~1.9× on stable Go."
[[params.repos]]
  name = "floats"
  accel = "Dot/Sum/Min/Max/Distance/CosineSimilarity (float32 + float64)"
  kind = "primitive"
  result = "only pure-Go lib with the full vector-search API on all 6 arches (gonum/vek/kelindar are amd64-centric or partial); arm64 ~2× scalar. ppc64le measured on real POWER9: f32 VSX kernel ~1.55–1.61× over naive, f64 routes to the gc-autovectorized scalar loop (it beats VSX there — honest)."
[[params.repos]]
  name = "xxhash"
  accel = "XXH3-64"
  kind = "primitive"
  result = "first Go XXH3 on all 6 SIMD arches, bit-exact vs official vectors. Honest: zeebo faster on arm64 (~22 vs ~15 GB/s), amd64 block-at-a-time kernel reaches ~0.94× zeebo. Where zeebo has no kernel we win big: riscv64 RVV ~2.5–3.5× zeebo on real X60 silicon; ppc64le near-parity (~0.91×) on real POWER9."
[[params.repos]]
  name = "streamvbyte"
  accel = "Stream VByte uint32 codec"
  kind = "primitive"
  result = "first Go port on all 6 arches (others amd64-only); full codec — SIMD encode and decode, byte-identical to lemire/streamvbyte; decode arm64 ~10× scalar. Measured native: ppc64le POWER9 decode ~11.6×, riscv64 X60 ~4.5×, loong64 ~11.8× scalar."
[[params.repos]]
  name = "ascii"
  accel = "ASCII case (ToUpper/ToLower/EqualFold)"
  kind = "drop-in"
  result = "branchless vector case-fold, byte-identical to bytes/strings; real SIMD on all 6 arches incl. arm64 (multiply-free sign-bit predicate); arm64 ~4.9× stdlib (ToUpper)."
[[params.repos]]
  name = "levenshtein"
  accel = "edit distance (Distance)"
  kind = "primitive"
  result = "Myers bit-parallel edit distance, 62–142× vs agnivade/levenshtein on long inputs. Honest: pure-Go bit-parallel, not vector-SIMD (word-serial column, no lane parallelism); endian-clean on all 6 arches."
[[params.repos]]
  name = "bitset"
  accel = "bulk []uint64 set ops"
  kind = "primitive"
  result = "SIMD And/Or/AndNot/Xor + fused Count/IntersectionCount; amd64 Count ~3–3.9×. Honest: logical ops are bandwidth-bound (converge to scalar out-of-cache), popcount wins across the board."
[[params.repos]]
  name = "int8dot"
  accel = "int8 quantized dot (Dot/DotUint8/DotU8S8)"
  kind = "primitive"
  result = "INT8 multiply-accumulate for ML embeddings, bit-exact vs scalar; amd64 AVX2 ~4×; arm64 NEON kernel on Go 1.27 (~2.4×; scalar on stable Go ≤ 1.26). Measured native: riscv64 X60 ~9.1× (biggest RVV win in the suite), loong64 ~8.9× (DotUint8 ~13.8×), ppc64le POWER9 ~4.1×."
[[params.repos]]
  name = "jsonvalidate"
  accel = "encoding/json.Valid"
  kind = "drop-in"
  result = "byte-identical verdict to encoding/json.Valid; only SIMD JSON validator on all 6 arches (simdjson-go is amd64-only); SIMD string/space scans, ~1.4× on string-heavy JSON (number-/structure-heavy stays scalar). Measured native on string-heavy: ppc64le POWER9 ~8.5× stdlib, riscv64 X60 ~5.2×."
