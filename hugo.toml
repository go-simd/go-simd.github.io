baseURL = "https://go-simd.github.io/"
title = "go-simd"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

# Each repo card. "result" is the honest headline (wins AND parities/non-SIMD
# outcomes). "kind" tags whether it is a stdlib drop-in or a primitive.
[[params.repos]]
  name = "base64"
  accel = "encoding/base64"
  kind = "drop-in"
  result = "encode ~17× stdlib; beats emmansun/base64 ~5–6% (cycle-model-guided)."
[[params.repos]]
  name = "base32"
  accel = "encoding/base32"
  kind = "drop-in"
  result = "encode ~7.9× stdlib (AVX2), SIMD decode too, and arm64 NEON encode + decode (decode ~25× at 1 MiB). Real SIMD on ppc64le VSRH + s390x VMLHH; ppc64le measured on real POWER9 (decode ~5.5×). No prior pure-Go SIMD base32."
[[params.repos]]
  name = "hex"
  accel = "encoding/hex"
  kind = "drop-in"
  result = "beats tmthrgd/go-hex both ways — encode 20.4×, decode 6.24× stdlib."
[[params.repos]]
  name = "utf8"
  accel = "unicode/utf8"
  kind = "drop-in"
  result = "Valid ~19× stdlib, edges stuartcarnie/go-simd ~3.5% (Lemire/Keiser)."
[[params.repos]]
  name = "adler32"
  accel = "hash/adler32"
  kind = "drop-in"
  result = "~12–14× stdlib, but ~7% behind mhr3/adler32-simd — near-parity, honest. New in v0.2.0: the fletcher4 subpackage (OpenZFS fletcher-4; scalar, NEON, AVX2 and AVX-512; 23 GB/s on M4, 45 GB/s on Zen 4 AVX-512)."
[[params.repos]]
  name = "strconv"
  accel = "strconv (base-10 parse + ParseFloat)"
  kind = "drop-in"
  result = "ParseInt/Atoi ~2.2–2.7× on long inputs; added SIMD ParseFloat (Eisel-Lemire, ~1.1–1.36×); never regresses (delegates short/uncertain)."
[[params.repos]]
  name = "matchlen"
  accel = "LZ match-finder primitive"
  kind = "primitive"
  result = "~10× scalar (NEON); real SIMD on all 6 arches; AVX2 ~2.08× SSE2. Measured native: ppc64le POWER9 ~6.3×, riscv64 X60 ~5.8×, loong64 ~11.4× scalar."
[[params.repos]]
  name = "matchlen-wasm"
  accel = "the 7th target: GOOS=js/wasip1 GOARCH=wasm"
  kind = "proof of concept"
  result = "Go emits no v128 from source and wasm has no Plan 9 asm dialect, so a naive wasm build of matchlen falls back to scalar. The kernel lives in a companion module compiled from matchlen.wat and is called through //go:wasmimport. Measured on wazero 1.12.0 it is SLOWER below 4 KiB — 0.16x scalar at 64 B, 0.94x at 1 KiB — crosses over at 4 KiB (1.19x) and reaches 1.43x at 64 KiB. The call boundary is the cost, which is why this is a proof of concept and not the default path."
[[params.repos]]
  name = "bitpack"
  accel = "FastPFOR / simdcomp bit-packing"
  kind = "primitive"
  result = "~21–32× scalar — byte-exact vs Lemire's simdcomp. ppc64le measured on real POWER9: Pack ~7.0×, Unpack ~11.3× (overturns the earlier ~1.1× llvm-mca estimate)."
[[params.repos]]
  name = "popcount"
  accel = "Hamming weight over []byte"
  kind = "primitive"
  result = "size-dependent: ~9–12× in-cache, converges to memory-bound out-of-cache. Measured native: loong64 LSX ~6.1×, ppc64le POWER9 ~2.9× scalar (riscv64 stays scalar — no per-element vector popcount in Go's RVV asm)."
[[params.repos]]
  name = "histogram"
  accel = "byte-value histogram"
  kind = "primitive"
  result = "multi-table scalar — measured, SIMD does NOT help (no scatter on AVX2/NEON)."
[[params.repos]]
  name = "crc64"
  accel = "hash/crc64"
  kind = "drop-in"
  result = "first pure-Go SIMD crc64 (stdlib + all Go libs are scalar); CLMUL folding, arm64 ~4.2× stdlib; all 6 arches (riscv64/loong64 scalar)."
[[params.repos]]
  name = "crc32"
  accel = "hash/crc32"
  kind = "drop-in"
  result = "arm64-only, deliberately: stdlib IEEE path is already hardware-assisted on amd64/ppc64le/s390x, so only arm64's serial CRC32X fallback is worth beating; PMULL/PMULL2 fold-by-eight does that, every other arch and non-IEEE polynomial just calls hash/crc32."
[[params.repos]]
  name = "ascii85"
  accel = "encoding/ascii85"
  kind = "drop-in"
  result = "first SIMD ascii85, SIMD encode AND decode; real SIMD on all 6 arches incl. an arm64 NEON kernel on Go 1.27. Measured native: ppc64le POWER9 ~2.9× encode, riscv64 X60 ~4.0×, loong64 ~4.3×; arm64 NEON ~3.0× / fused-scalar ~1.9× on stable Go."
[[params.repos]]
  name = "floats"
  accel = "Dot/Sum/Min/Max/Distance/CosineSimilarity (float32 + float64); Axpy/Xpby/AxpyDot/Scale (float64); Mul/Axpby3/Clamp/MaxAbs (float64); Add/Sub/Div/Sqrt/ClampScalar (float64, bit-identical to NumPy, since v0.8.0); SumPairwise (float64, bit-identical to np.sum); AxpyNoFMA/XpbyNoFMA/Axpby3NoFMA/AxpyDiffNoFMA (float64, unfused, bit-identical to NumPy); Abs/Neg/Square/Floor/Ceil/Trunc/RoundEven (float64, since v0.23.0); MaxAbsMul (float64, weighted max-norm); Maximum/Minimum (float64, pairwise, since v0.26.0); MirrorCombine/MirrorCombineSplit (float64, the (k, n-k) paired combine of a real transform through a half-length complex one, since v0.27.0); CMulZipRev (float64, complex multiply with one operand read reversed, since v0.28.0); Add32/Sub32/Mul32/Div32/Sqrt32 (float32 elementwise, AVX2/SSE2/NEON, exhaustively checked Sqrt32, since v0.30.0; loong64/ppc64le/riscv64/s390x kernels since v0.32.0, QEMU-verified, unmeasured on hardware); CMulTo (complex128, pointwise a[i]*b[i], since v0.31.0)"
  kind = "primitive"
  result = "only pure-Go lib with the full vector-search API on all 6 arches (gonum/vek/kelindar are amd64-centric or partial); arm64 ~2× scalar. Since v0.4.0 the BLAS-1 updates Axpy/Xpby/AxpyDot/Scale, bit-identical to math.FMA on every arch: AVX2 3.0–7.7×, M4 NEON 1.6–5.3× over the scalar loop at n=1e3–1e6. Since v0.5.0 the QP/ADMM kernels Mul, Axpby3 (fused), Clamp (box projection, exact NaN and signed-zero rules) and MaxAbs (∞-norm, NaN-propagating) on amd64 AVX2 and arm64 NEON; M4 NEON against NumPy 2.5.4 on one core: Axpby3 3.1–12.4×, Clamp 2.2–6.2×, MaxAbs 2.8–7.6×, Mul 2.6× at n=1e3 and level with NumPy at 1e5–1e6 (memory-bound). Since v0.6.0 SumPairwise reproduces np.sum bit for bit on every arch (NumPy's pairwise order; 6,990 NumPy fixtures, 0 mismatches). Since v0.7.0 its blocks run in SIMD (AVX2 2x4 lanes, NEON 4x2 lanes, same bits) and the unfused AxpyNoFMA, XpbyNoFMA, Axpby3NoFMA and AxpyDiffNoFMA (a + F*(b - c)) round every operation as NumPy does (13,088 NumPy fixtures, 0 mismatches on arm64 and amd64). ppc64le measured on real POWER9: f32 VSX kernel ~1.55–1.61× over naive, f64 routes to the gc-autovectorized scalar loop (it beats VSX there — honest). Since v0.23.0 the elementwise Abs, Neg, Square, Floor, Ceil, Trunc and RoundEven (float64) run as vector kernels, bit for bit the result of Go's math functions for numbers (Abs and Neg keep every NaN's bits; a signalling NaN may come back quieted from the others): 2.7–3.6× the scalar loop at n=1e5 and 6–11× at 1e3 on one Zen 3 core, with the rounding functions scalar on riscv64 and on amd64 without AVX2. MaxAbsMul, the weighted max-norm max(abs(v[i])*w[i]), bit-identical to its C fmax loop, takes 0.17–0.43 of NumPy's time on one arm64 core. Since v0.26.0 the pairwise Maximum and Minimum (float64) are bit-identical to Go's max and min builtins for numbers and zeros (max(-0, +0) is +0 in either order), with the NaN rules documented in the README (a NaN operand comes back unchanged with a vector kernel; the payload may differ from the compiler's own max on arm64 and amd64): 2.0–3.0× the scalar loop at 1e5 and 3.9–5.0× at 1e3. Since v0.27.0 MirrorCombine and MirrorCombineSplit (AVX2+FMA on amd64, portable loop elsewhere) compute r[k] = w1[k]·(z[k] + conj(z[n-k])) + w2[k]·(-i (z[k] - conj(z[n-k]))), within 4 eps against a 300-bit oracle; in go-fft's DCT-II of 64 points they take 102 to 84 ns (FFTW 3.3.10 AVX-512: 81.6 ns). Since v0.28.0 CMulZipRev(dst, x, y, w) computes dst[j] = w[j]·(x[j] − i·y[m−1−j]) (complex, y read reversed; AVX2+FMA on amd64, portable loop elsewhere; dst must not overlap x, y or w), the DCT-III reversed-gather multiply of go-fft v0.43.0: DCT-III of 64 points 111.2 to 97.9 ns on a Zen 4 (go-fft#175). Since v0.30.0 Add32, Sub32, Mul32, Div32 and Sqrt32 (float32) are one IEEE operation per lane, bit-identical to the scalar loop (AVX2 and SSE2 on amd64, NEON on arm64; since v0.32.0 also LSX on loong64, VSX on ppc64le, RVV on riscv64 and VXE on s390x, verified under QEMU and unmeasured on hardware); Sqrt32 is proved correctly rounded over all 2^32 inputs on amd64 and arm64. Since v0.31.0 CMulTo(dst, a, b []complex128) is the pointwise complex product dst[i] = a[i]·b[i] (AVX2+FMA on amd64, NEON on arm64, portable loop elsewhere; each part within 2 eps of the exact value times |a||b|, asserted against a 300-bit oracle; dst may alias a or b): on one Zen 4 core 1.8–3.4× the scalar loop from n=64 to 65536, 0.90 of np.multiply's time at 65536 and 21–45× faster than it at n=16–64 (NumPy's call overhead); M4 NEON 1.3–2.6× the scalar loop at n≥64 (measured on a loaded machine). Since v0.35.0 the reductions (Dot, Sum, Distance and the float32 forms) run eight independent accumulators on amd64, ppc64le (VSX) and s390x (VX, float32 now vectorised): one core, n=1000, Zen 4 Dot 3.2x and Sum 4.3x, POWER9 Sum 934 to 281 ns, z17 Float32Sum 2898 to 61 ns; the contract is an error bound against a 512-bit oracle."
[[params.repos]]
  name = "xxhash"
  accel = "XXH3-64"
  kind = "primitive"
  result = "first Go XXH3 on all 6 SIMD arches, bit-exact vs official vectors. Honest: zeebo faster on arm64 (~22 vs ~15 GB/s), amd64 block-at-a-time kernel reaches ~0.94× zeebo. Where zeebo has no kernel we win big: riscv64 RVV ~2.5–3.5× zeebo on real X60 silicon; ppc64le near-parity (~0.91×) on real POWER9."
[[params.repos]]
  name = "streamvbyte"
  accel = "Stream VByte uint32 codec"
  kind = "primitive"
  result = "first Go port on all 6 arches (others amd64-only); full codec — SIMD encode and decode, byte-identical to lemire/streamvbyte; decode arm64 ~10× scalar. Measured native: ppc64le POWER9 decode ~11.6×, riscv64 X60 ~4.5×, loong64 ~11.8× scalar."
[[params.repos]]
  name = "ascii"
  accel = "ASCII case (ToUpper/ToLower/EqualFold)"
  kind = "drop-in"
  result = "branchless vector case-fold, byte-identical to bytes/strings; real SIMD on all 6 arches incl. arm64 (multiply-free sign-bit predicate); arm64 ~4.9× stdlib (ToUpper)."
[[params.repos]]
  name = "levenshtein"
  accel = "edit distance (Distance)"
  kind = "primitive"
  result = "Myers bit-parallel edit distance, 62–142× vs agnivade/levenshtein on long inputs. Honest: pure-Go bit-parallel, not vector-SIMD (word-serial column, no lane parallelism); endian-clean on all 6 arches."
[[params.repos]]
  name = "bitset"
  accel = "bulk []uint64 set ops"
  kind = "primitive"
  result = "SIMD And/Or/AndNot/Xor + fused Count/IntersectionCount; amd64 Count ~3–3.9×. Honest: logical ops are bandwidth-bound (converge to scalar out-of-cache), popcount wins across the board. FromBools/ToBools (amd64 AVX2, arm64 NEON): 1.2–3.6× NumPy packbits/unpackbits at 2^16–2^20 on Neoverse N1 and Zen 3."
[[params.repos]]
  name = "int8dot"
  accel = "int8 quantized dot (Dot/DotUint8/DotU8S8)"
  kind = "primitive"
  result = "INT8 multiply-accumulate for ML embeddings, bit-exact vs scalar; amd64 AVX2 ~4×; arm64 NEON kernel on Go 1.27 (~2.4×; scalar on stable Go ≤ 1.26). Measured native: riscv64 X60 ~9.1× (biggest RVV win in the suite), loong64 ~8.9× (DotUint8 ~13.8×), ppc64le POWER9 ~4.1×."
[[params.repos]]
  name = "jsonvalidate"
  accel = "encoding/json.Valid"
  kind = "drop-in"
  result = "byte-identical verdict to encoding/json.Valid; only SIMD JSON validator on all 6 arches (simdjson-go is amd64-only); SIMD string/space scans, ~1.4× on string-heavy JSON (number-/structure-heavy stays scalar). Measured native on string-heavy: ppc64le POWER9 ~8.5× stdlib, riscv64 X60 ~5.2×."
[[params.repos]]
  name = "gf256"
  accel = "GF(2^8) multiply / multiply-accumulate by a constant over byte slices (Reed-Solomon, poly 0x11D)"
  kind = "primitive"
  result = "VPSHUFB/PSHUFB nibble-table kernels on amd64 (AVX2, SSSE3) and TBL on arm64, with a 64 KiB product-table fallback elsewhere; same field as ISA-L, klauspost/reedsolomon and Backblaze. A GFNI tier is offered only if it passes a start-up self-check and has not run on real hardware yet."
[[params.repos]]
  name = "gf65536"
  accel = "GF(2^16) region multiply / multiply-accumulate (PAR2 and Reed-Solomon, poly 0x1100B)"
  kind = "primitive"
  result = "split-table kernels on all 6 arches, moved here from go-erasure/reedsolomon, which now imports them. New amd64 AVX2 tier: about 2.0× the SSSE3 kernel on a Xeon 6975P-C runner (~10 to ~20 GB/s, interleaved CI run); arm64 NEON unchanged (1.00×, ~7.9 GB/s on Neoverse-N2). riscv64, loong64, ppc64le and s390x are QEMU-tested, not timed. GFNI not done (issue #3)."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 4.88:1, bright on the dark background 9.94:1.
  base = "#0079a8"
  deep = "#004a66"
  bright = "#22cce2"
  shadow = "rgba(0,121,168,.7)"
  glow = "rgba(0,121,168,.6)"
  wash = "rgba(0,121,168,.10)"
  washDeep = "rgba(0,74,102,.06)"
  chipBg = "#e4f9fc"
  chipBorder = "#bdf0f6"
  chipFg = "#004a66"
  chipBgDark = "rgba(34,204,226,.14)"
  chipBorderDark = "rgba(34,204,226,.32)"
  chipFgDark = "#85e3ef"
  statsEnd = "#caf3f8"
  bandText = "#dcf7fa"

# The hero's buttons, rendered by landingkit's cta.html in the kit's order.
[[params.cta]]
  kind  = "docs"
  href  = "/docs/"
  label = "Documentation"
[[params.cta]]
  kind  = "github"
  href  = "https://github.com/go-simd"
  label = "GitHub"

# The architectures the tests RUN on, read from the library's CI.
[params.mantra]
  goarch = ["amd64", "arm64"]
